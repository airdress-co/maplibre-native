# The fork's CI. main holds the patch series, not upstream's tree, so every
# job first applies the series to its base and runs upstream's own build and
# suites in the applied tree.
#
# Only GitHub-hosted runners, ever: this is a public repository, and a pull
# request from anyone could run code on a self-hosted one. Only GitHub-owned
# actions, pinned by SHA: the repository's Actions allowlist permits nothing
# else. Upstream's composite actions are not used, since they call
# third-party ones.
name: fork-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APPLIED: applied

jobs:
  series:
    name: series
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The pull request's own commits, for the message check.
          fetch-depth: 0
      - name: No internal references in the pull request's commits, title or body
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          airdress/scripts/commit-messages.sh --range "$BASE_SHA..$HEAD_SHA"
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | airdress/scripts/commit-messages.sh --stdin "the pull request"
      - name: No internal references in main's new commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # A branch's first push has no "before".
          case "$BEFORE" in 0000000000000000000000000000000000000000) range="$AFTER" ;; *) range="$BEFORE..$AFTER" ;; esac
          airdress/scripts/commit-messages.sh --range "$range"
      - name: Tooling tests
        run: python3 -m unittest discover -s airdress/test -v
      - name: Files, series and entries agree; the series applies; a refresh reproduces it
        run: python3 airdress/scripts/series-check.py --apply --repo "$APPLIED" --divergence-out divergence.md
      - name: No internal references in the patches' commit messages
        run: airdress/scripts/commit-messages.sh --range "$(awk '$1 == "base" { print $2 }' patches/series)..HEAD" --repo "$APPLIED"
      - name: The globe group is a fresh import of its recorded head
        run: python3 airdress/scripts/series-check.py --globe
      - name: No document numbers in the patches
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: airdress/scripts/doc-numbers.sh "$HEAD_REF"
      - name: Divergence
        run: cat divergence.md >> "$GITHUB_STEP_SUMMARY"

  core:
    name: core (globe ${{ matrix.globe }})
    needs: series
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # ON: the globe and its tests. OFF: upstream's suites unchanged, the
        # globe compiled out.
        globe: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the series
        run: airdress/scripts/apply.sh --repo "$APPLIED"
      - name: Install dependencies
        working-directory: applied
        run: |
          .github/scripts/install-linux-deps
          # The linux preset launches the compiler through ccache; upstream's CI
          # overrides it with sccache on its own S3 cache, which we do not have.
          sudo apt-get install -y ccache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-core-${{ matrix.globe }}-${{ github.sha }}
          restore-keys: ccache-core-${{ matrix.globe }}-
      - name: Build
        working-directory: applied
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          cmake --preset linux-opengl -DMLN_WITH_GLOBE=${{ matrix.globe }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-linux-opengl --target mbgl-test-runner mbgl-render-test-runner mbgl-expression-test
      - name: C++ tests
        working-directory: applied
        run: xvfb-run -a build-linux-opengl/mbgl-test-runner
      - name: Render tests
        working-directory: applied
        run: xvfb-run -a build-linux-opengl/mbgl-render-test-runner --manifestPath=metrics/linux-opengl.json
      - name: Expression tests
        working-directory: applied
        run: build-linux-opengl/expression-test/mbgl-expression-test
      - name: Upload the render test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-tests-globe-${{ matrix.globe }}
          path: applied/metrics/linux-opengl.html
          if-no-files-found: ignore

  android:
    name: android
    needs: series
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      BUILDTYPE: Release
      IS_LOCAL_DEVELOPMENT: false
      MLN_ANDROID_STL: c++_static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the series
        run: airdress/scripts/apply.sh --repo "$APPLIED"
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: applied/.nvmrc
      - name: Generated style code
        working-directory: applied
        run: |
          npm ci --ignore-scripts
          node platform/android/scripts/generate-style-code.mjs
      - name: Unit tests (OpenGL ES)
        working-directory: applied/platform/android
        run: |
          echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> local.properties
          RENDERER=opengl make run-android-unit-test
      - name: Build the library (OpenGL ES, arm64-v8a)
        working-directory: applied/platform/android
        run: ./gradlew :MapLibreAndroid:assembleOpenglRelease -Pmaplibre.abis=arm64-v8a

  ios:
    name: ios
    needs: series
    # GitHub-hosted: free on a public repository. Never a self-hosted Mac.
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Apply the series
        run: airdress/scripts/apply.sh --repo "$APPLIED"
      - name: Build the xcframework (globe on)
        working-directory: applied/platform/ios
        run: bazel build //platform/ios:MapLibre.dynamic --//:renderer=metal --//:globe=true --compilation_mode=opt
      - name: iOS unit tests
        working-directory: applied/platform/ios
        run: bazel test //platform/ios/test:ios_test --test_output=errors --//:renderer=metal --//:globe=true
