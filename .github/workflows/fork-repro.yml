# Is a build of this fork reproducible, and where is it not? Builds the same
# tree twice on fresh GitHub-hosted runners, per platform, the way
# fork-release.yml does, and compares the two with compare-builds.py. It
# pushes nothing and publishes nothing; the report is the job summary and an
# artifact.
#
#   tree: upstream   the series' base alone, no patches (what upstream ships)
#   tree: series     the whole series, as a release would build it
#
# Every difference it finds that cannot be removed goes into
# airdress/build-differences.txt with its cause, before the first release.
name: fork-repro

on:
  workflow_dispatch:
    inputs:
      tree:
        description: "upstream (the base, no patches) or series"
        required: true
        default: upstream
        type: choice
        options: [upstream, series]

permissions:
  contents: read

concurrency:
  group: fork-repro
  cancel-in-progress: false

jobs:
  android:
    name: android (${{ matrix.run }})
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    strategy:
      matrix:
        run: [first, second]
    env:
      BUILDTYPE: Release
      IS_LOCAL_DEVELOPMENT: false
      MLN_ANDROID_STL: c++_static
      ABIS: arm64-v8a armeabi-v7a x86_64
      TREE: ${{ inputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tree
        run: |
          if [ "$TREE" = upstream ]; then
            awk '$1 == "base"' patches/series > "$RUNNER_TEMP/series"
            SERIES_FILE_OVERRIDE="$RUNNER_TEMP/series" airdress/scripts/apply.sh --repo applied
          else
            airdress/scripts/apply.sh --repo applied
          fi
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: applied/.nvmrc
      - name: Generated style code
        working-directory: applied
        run: |
          npm ci --ignore-scripts
          node platform/android/scripts/generate-style-code.mjs
      - name: Build into a local Maven repository (OpenGL ES)
        working-directory: applied/platform/android
        run: |
          echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> local.properties
          ./gradlew -Pmaplibre.abis="$ABIS" :MapLibreAndroid:publishOpenglReleasePublications \
            -PpublicationRepositoryUrl="file://$RUNNER_TEMP/maven"
      - name: Zip
        run: |
          (cd "$RUNNER_TEMP/maven" && find . -type f -print0 | sort -z | xargs -0 touch -h -d @0 && find . -type f | sort | TZ=UTC zip -X -q -@ "$RUNNER_TEMP/maplibre-android-maven.zip")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.run }}
          path: ${{ runner.temp }}/maplibre-android-maven.zip

  ios:
    name: ios (${{ matrix.run }})
    # GitHub-hosted: free on a public repository. Never a self-hosted Mac.
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      matrix:
        run: [first, second]
    env:
      TREE: ${{ inputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tree
        run: |
          if [ "$TREE" = upstream ]; then
            awk '$1 == "base"' patches/series > "$RUNNER_TEMP/series"
            SERIES_FILE_OVERRIDE="$RUNNER_TEMP/series" airdress/scripts/apply.sh --repo applied
          else
            airdress/scripts/apply.sh --repo applied
          fi
      - name: Build the dynamic xcframework (Metal)
        working-directory: applied
        run: |
          # The globe flag exists only once the series' globe group is in.
          flag=""
          [ "$TREE" = upstream ] || flag="--//:globe=true"
          bazel build //platform/ios:MapLibre.dynamic --//:renderer=metal $flag --compilation_mode=opt
          cp "$(bazel info --compilation_mode=opt bazel-bin)/platform/ios/MapLibre.dynamic.xcframework.zip" "$RUNNER_TEMP/"
          { echo "Xcode: $(xcodebuild -version | head -1)"; echo "Bazel: $(bazel --version)"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ matrix.run }}
          path: ${{ runner.temp }}/MapLibre.dynamic.xcframework.zip

  compare:
    name: compare
    needs: [android, ios]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: builds
      - name: Compare (a difference is reported, not fatal, here)
        env:
          TREE: ${{ inputs.tree }}
        run: |
          {
            echo "## Reproducibility: $TREE tree"
            echo
            for p in android ios; do
              echo "### $p"
              echo '```'
              python3 airdress/scripts/compare-builds.py "$p" "builds/$p-first" "builds/$p-second" || true
              echo '```'
            done
          } | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: report.md
