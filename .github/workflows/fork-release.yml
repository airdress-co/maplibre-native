# A release of the series: apply it to its base and push the applied branch
# once (refused if it or either tag exists), build the Android Maven
# repository and the iOS xcframework twice each on fresh GitHub-hosted
# runners from that branch's commit, compare the builds, and only then push
# both platform tags, attest, and publish one GitHub Release per tag. A build
# or comparison that fails leaves the branch as the record and no tag, so
# the release number is not spent on an artifact nobody can use. Both apps
# pin these assets by SHA-256.
name: fork-release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "The release number n: versions become <upstream>-airdress.<n>"
        required: true

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  apply:
    name: apply and push the applied tree
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      sha: ${{ steps.push.outputs.sha }}
      android: ${{ steps.push.outputs.android }}
      ios: ${{ steps.push.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: bot
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Apply, and push the branch once
        id: push
        env:
          TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          RELEASE: ${{ inputs.release }}
        run: |
          [[ "$RELEASE" =~ ^[1-9][0-9]*$ ]] || { echo "release is a positive integer, not $RELEASE" >&2; exit 1; }
          base="$(awk '$1 == "base" { print $2 }' patches/series)"
          branch="airdress/$base-airdress.$RELEASE"
          airdress/scripts/apply.sh --repo applied --branch "$branch" --release "$RELEASE" --no-submodules
          android="android-v$(cat applied/platform/android/VERSION)"
          ios="ios-v$(cat applied/platform/ios/VERSION)"
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if [ -n "$(git ls-remote "$remote" "refs/heads/$branch" "refs/tags/$android" "refs/tags/$ios")" ]; then
            echo "$branch, $android or $ios exists: an applied branch and its tags are pushed once and never moved" >&2
            exit 1
          fi
          # The applied tree has none of upstream's workflows (infra/0001), so
          # this push runs nothing. The tags follow once the builds agree.
          git -C applied push -q "$remote" "$branch"
          { echo "branch=$branch"; echo "sha=$(git -C applied rev-parse HEAD)"
            echo "android=$android"; echo "ios=$ios"; } >> "$GITHUB_OUTPUT"

  android:
    name: android (${{ matrix.run }})
    needs: apply
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    strategy:
      matrix:
        # Two runners build the same tag independently; publish compares them.
        run: [first, second]
    permissions:
      contents: read
    env:
      BUILDTYPE: Release
      IS_LOCAL_DEVELOPMENT: false
      MLN_ANDROID_STL: c++_static
      ABIS: arm64-v8a armeabi-v7a x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.apply.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc
      - name: Generated style code
        run: |
          npm ci --ignore-scripts
          node platform/android/scripts/generate-style-code.mjs
      - name: Build and publish into a local Maven repository (OpenGL ES, globe on)
        working-directory: platform/android
        run: |
          echo "cmake.dir=$(dirname "$(dirname "$(command -v cmake)")")" >> local.properties
          # The ABIs both apps ship, not upstream's apackage target, which
          # builds all four.
          ./gradlew -Pmaplibre.abis="$ABIS" :MapLibreAndroid:publishOpenglReleasePublications \
            -PpublicationRepositoryUrl="file://$RUNNER_TEMP/maven"
      - name: Zip
        id: zip
        run: |
          version="$(cat platform/android/VERSION)"
          name="maplibre-android-$version-maven.zip"
          (cd "$RUNNER_TEMP/maven" && find . -type f -print0 | sort -z | xargs -0 touch -h -d @0 && find . -type f | sort | TZ=UTC zip -X -q -@ "$RUNNER_TEMP/$name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Native symbols (the unstripped libraries, as upstream's apackage keeps them)
        if: matrix.run == 'first'
        run: |
          version="$(cat platform/android/VERSION)"
          (cd platform/android/MapLibreAndroid/build/intermediates/merged_native_libs/openglRelease/*/out/lib \
            && TZ=UTC zip -X -q -r "$RUNNER_TEMP/maplibre-android-$version-native-symbols.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.run }}
          path: ${{ runner.temp }}/${{ steps.zip.outputs.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.run == 'first'
        with:
          name: android-symbols
          path: ${{ runner.temp }}/maplibre-android-*-native-symbols.zip

  ios:
    name: ios (${{ matrix.run }})
    needs: apply
    # GitHub-hosted: free on a public repository. Never a self-hosted Mac.
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      matrix:
        run: [first, second]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.apply.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Build the dynamic xcframework (Metal, globe on)
        run: |
          # Upstream's own release flags for MapLibre.dynamic (ios-release.yml),
          # dSYMs included, so a crash inside MapLibre can be symbolicated.
          bazel build --compilation_mode=opt --//:renderer=metal --//:globe=true \
            --features=dead_strip,thin_lto --objc_enable_binary_stripping --apple_generate_dsym \
            //platform/ios:MapLibre.dynamic --embed_label=maplibre_ios_"$(cat platform/ios/VERSION)"
          cp "$(bazel info --compilation_mode=opt bazel-bin)/platform/ios/MapLibre.dynamic.xcframework.zip" "$RUNNER_TEMP/"
          chmod +w "$RUNNER_TEMP/MapLibre.dynamic.xcframework.zip"
          zip -q "$RUNNER_TEMP/MapLibre.dynamic.xcframework.zip" LICENSE.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ matrix.run }}
          path: ${{ runner.temp }}/MapLibre.dynamic.xcframework.zip

  publish:
    name: compare and publish
    needs: [apply, android, ios]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: builds
      - name: The two builds of each platform agree
        run: |
          # The symbols are not compared; they are the same build's own libraries.
          python3 airdress/scripts/compare-builds.py android builds/android-first builds/android-second
          python3 airdress/scripts/compare-builds.py ios builds/ios-first builds/ios-second
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            builds/android-first/*.zip
            builds/ios-first/*.zip
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: bot
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - name: Push both tags, now that the builds agree
        env:
          TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.apply.outputs.sha }}
          ANDROID: ${{ needs.apply.outputs.android }}
          IOS: ${{ needs.apply.outputs.ios }}
        run: |
          # Lightweight tags through the API, as airdress-bot, which alone may
          # create them (the tag rulesets).
          for t in "$ANDROID" "$IOS"; do
            GH_TOKEN="$TOKEN" gh api "repos/$REPO/git/refs" -f ref="refs/tags/$t" -f sha="$SHA" >/dev/null
          done
      - name: Release notes and checksums
        env:
          BRANCH: ${{ needs.apply.outputs.branch }}
        run: |
          base="$(awk '$1 == "base" { print $2 }' patches/series)"
          head="$(awk '$1 == "globe-pr" { print $3 }' patches/series)"
          cp builds/android-symbols/*.zip builds/android-first/
          (cd builds/android-first && sha256sum ./*.zip > SHA256SUMS)
          (cd builds/ios-first && sha256sum ./*.zip > SHA256SUMS)
          {
            echo "MapLibre Native \`$base\` with the fork's patch series, built from the applied branch \`$BRANCH\`."
            echo
            [ -z "$head" ] || echo "The globe: maplibre/maplibre-native#4533 at \`$head\`, one patch per phase."
            echo
            echo "| Patch | Group |"
            echo "|---|---|"
            awk '!/^#/ && NF && $1 != "base" && $1 != "globe-pr" { split($1, p, "/"); print "| `" $1 "` | " p[1] " |" }' patches/series
            echo
            echo "Build differences the comparison allows, from \`airdress/build-differences.txt\`:"
            echo
            grep -v '^#' airdress/build-differences.txt | sed '/^$/d; s/^/- `/; s/$/`/' || echo "- none"
          } > notes.md
      - name: Publish the GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID: ${{ needs.apply.outputs.android }}
          IOS: ${{ needs.apply.outputs.ios }}
        run: |
          gh release create "$ANDROID" --verify-tag --title "$ANDROID" --notes-file notes.md \
            builds/android-first/*.zip builds/android-first/SHA256SUMS
          gh release create "$IOS" --verify-tag --title "$IOS" --notes-file notes.md \
            builds/ios-first/*.zip builds/ios-first/SHA256SUMS
