[[patch]]
file = "ours/0001-metal-async-shader-libraries.patch"
group = "ours"
summary = "Metal shader libraries compile off the render thread; drawables wait instead of blocking (upstream's open #4563, its author's commit, carried until merged; no offer or comment from us)"
offer = "offered-upstream"
route = "upstream-pr"
link = "https://github.com/maplibre/maplibre-native/pull/4563"
drop_when = "a base release contains #4563's merge commit"
tests = ["//platform/ios/test:ios_test MLNAsyncShaderCompilationTests"]

[[patch]]
file = "ours/0002-metal-async-pipeline-states.patch"
group = "ours"
summary = "Metal render pipeline states build off the render thread for async-compiled programs, the hang #4563 leaves on a cold shader cache"
offer = "owner-declined"
drop_when = "a base release builds pipeline states asynchronously (with #4563 or a successor)"
tests = ["//platform/ios/test:ios_test MLNAsyncShaderCompilationTests"]

[[patch]]
file = "ours/0003-metal-async-clip-masks.patch"
group = "ours"
summary = "The Metal tile clipping mask compiles asynchronously too; its tile layer groups wait a frame instead of the main thread"
offer = "owner-declined"
drop_when = "a base release compiles the clipping mask off the render thread"
tests = ["//platform/ios/test:ios_test MLNAsyncShaderCompilationTests"]
